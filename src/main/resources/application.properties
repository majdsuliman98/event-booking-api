spring.application.name=Event-booking

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/event_booking}
spring.datasource.username=${DB_USERNAME:event_user}
spring.datasource.password=${DB_PASSWORD:event_password}

spring.jpa.hibernate.ddl-auto=validate

logging.level.com.majd.Event_booking=DEBUG

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100